[package]
name = "rd-manager"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "On-demand RepoDock management interface"

[workspace]

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
rd-agent = { path = "../../../crates/rd-agent" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
